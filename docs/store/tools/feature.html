<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}
  body{background:radial-gradient(120% 120% at 0% 0%,#1d3d63 0%,#102840 55%,#0b1c30 100%);color:#fff;position:relative}
  .glow{position:absolute;right:-140px;top:-160px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(255,193,7,.32) 0%,rgba(255,193,7,0) 65%)}
  .icon{position:absolute;left:72px;top:110px;width:280px;height:280px;border-radius:64px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
  .text{position:absolute;left:400px;top:118px;right:60px}
  h1{font-size:76px;margin:0;font-weight:800;letter-spacing:-.02em}
  h2{font-size:30px;margin:10px 0 0;font-weight:600;color:#FFC107}
  p{font-size:22px;color:#c9d6e6;margin:18px 0 0;line-height:1.35}
</style></head>
<body><div class="glow"></div>
<img class="icon" id="icon" src="">
<div class="text"><h1>AdPocket</h1><h2 id="h2"></h2><p id="p"></p></div>
<script>const q=new URLSearchParams(location.search);document.getElementById('icon').src=q.get('icon')||'';document.getElementById('h2').textContent=q.get('h')||'';document.getElementById('p').textContent=q.get('p')||'';</script>
</body></html>
